
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0916" />
  <title>Hide & Seek</title>
  <link rel="stylesheet" href="/Src/css/style.css" />
</head>
<body>
  <main class="landing">
    <header class="header">
      <a class="brand" href="/">
        <span class="brand-icon">👻</span>
        Hide <span class="accent">&</span> Seek
      </a>

      <span class="header-note">PLAY · CONNECT · HAVE FUN</span>
    </header>

    <section class="hero">
      <span class="eyebrow">A REAL-WORLD MULTIPLAYER GAME</span>

      <h1>Hide <span>&</span> Seek</h1>

      <p class="subtitle">
        Find your friends. Or hide from them.
      </p>

      <div class="art">
        <div class="moon"></div>
        <div class="ghost">👻</div>
        <div class="hider">🫣</div>
        <div class="ground"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="create-room">
          <span>＋</span> Create Room
        </button>

        <button class="btn btn-secondary" id="join-room">
          <span>↪</span> Join Room
        </button>

        <button class="btn btn-secondary" id="test-gps">
  Test GPS
</button>
      </div>

      <footer class="footer">
        <span class="footer-line"></span>
        <span>👻</span>
        <span class="footer-line"></span>
        <p>A SIMPLE MULTIPLAYER GAME</p>
      </footer>
    </section>
  </main>

  <script type="module" src="/Src/js/app.js"></script>
</body>
</html>
